<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHARACTER | Chronostasis</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;700;900&display=swap');
        @font-face {
            font-family: 'VitroPRIDE';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_20-10-21@1.0/VitroPride.woff2') format('woff2'),
                 url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_20-10-21@1.0/VitroPride.woff') format('woff');
        }

        :root {
            --red: #D73A33;
            --red-dark: #A82D28;
            --red-deep: #8f1f1b;
            --blue: #5877b8;
            --cream: #f4f2e9;
            --ink: #1d1d1f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--red);
            color: var(--ink);
            font-family: 'VitroPRIDE', sans-serif;
            overflow-x: hidden;
        }
        html { scroll-behavior: smooth; }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; }

        .stage { position: relative; width: 100%; height: 100vh; height: 100svh; overflow: hidden; }

        /* ===== 1) 맨 뒤: 메인 페이지와 같은 구름 영상 ===== */
        .sky { position: fixed; inset: 0; z-index: -30; background: #8fb3e6; }   /* 스크롤해도 구름은 제자리 → 뚫린 곳마다 같은 하늘 */
        .sky video { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* ===== 2) 그 위: 빨간 판. 곡선·사선·시계·카세트 모양으로 뚫려 있어 구름이 보인다 ===== */
        .cutout { position: absolute; top: 0; left: 0; z-index: -10; width: 100%; height: 100vh; display: block; }   /* 높이는 JS가 페이지 전체로 */
        /* 초침 구멍: 1초에 한 칸씩 (계속 그리지 않도록 뚝뚝 움직임) */
        .tick-hand { transform-box: view-box; transform-origin: 250px 712px; animation: tick 60s steps(60) infinite; }
        @keyframes tick { to { transform: rotate(360deg); } }

        /* ===== 3) 오른쪽의 크게 확대된 캐릭터(흐릿한 배경용) ===== */
        /* 구름(맨 뒤)과 빨간 판 사이에 있어서, 빨간 판에 뚫린 곳으로만 비친다 */
        /* 빨간 판 뒤(구름 위)에 크게 확대된 캐릭터 얼굴. 눈이 오른쪽 위 곡선 띠·카세트 구멍에 오도록 JS가 위치를 맞춘다 */
        .bust {
            position: absolute; z-index: -20; top: 0; left: 0; height: 100vh; width: 100%; overflow: hidden;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(90deg, transparent 38%, #000 62%);
                    mask-image: linear-gradient(90deg, transparent 38%, #000 62%);
        }
        .bust img {
            position: absolute; width: auto;
            filter: grayscale(1) contrast(1.25);
            opacity: .62; mix-blend-mode: multiply;     /* 더 진하게: 구름 위에 또렷한 회색 얼굴 */
            transition: opacity .3s ease;
        }

        /* ===== 위쪽 ===== */
        .logo {
            position: absolute; z-index: 10; top: clamp(20px, 3vh, 34px); left: clamp(20px, 2.4vw, 44px);
            font: 300 clamp(16px, 1.25vw, 22px) 'Barlow', sans-serif; letter-spacing: .34em; color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,.25);
        }
        .back {
            position: absolute; z-index: 10; top: clamp(18px, 3vh, 30px); right: clamp(20px, 2.4vw, 44px);
            display: inline-flex; align-items: center; gap: 12px;
            font: 700 13px 'Barlow', sans-serif; letter-spacing: .3em;
            color: #fff; padding: 11px 18px; background: #202020; box-shadow: 4px 4px 0 var(--red-deep);
            transition: background .18s, transform .18s, box-shadow .18s;
        }
        .back:hover, .back:focus-visible { background: var(--blue); transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--red-deep); outline: none; }

        .heading { position: absolute; z-index: 4; top: clamp(70px, 9vh, 100px); left: 50%; transform: translateX(-50%); text-align: center; }
        .heading h2 { font: 900 clamp(2rem, 3.2vw, 3.6rem)/1 'Barlow', sans-serif; letter-spacing: .3em; color: var(--ink); padding-left: .3em; }
        .heading p {
            display: inline-block; margin-top: 10px; padding: 5px 34px;
            font-size: clamp(14px, 1.2vw, 20px); letter-spacing: .4em; color: var(--cream);
            background: var(--red-deep); border-radius: 999px;
        }

        /* ===== 왼쪽 정보 ===== */
        .info {
            position: absolute; z-index: 5;
            left: clamp(90px, 15vw, 300px); top: 27vh;
            width: min(48vw, 860px);
        }
        .watermark {                                    /* 이름 뒤의 큰 영어 글자 */
            position: absolute; z-index: 2;            /* 빨간 판(-2) 위, 캐릭터 그림(3) 아래 */
            left: calc(clamp(90px, 15vw, 300px) + min(48vw, 860px) * .16); top: 21.5vh;
            font: 900 clamp(7rem, 15vw, 17rem)/.9 'Barlow', sans-serif; letter-spacing: -.04em;
            color: rgba(255,255,255,.13); white-space: nowrap; pointer-events: none;
        }
        .tag { display: flex; align-items: center; gap: 10px; font: 700 clamp(14px, 1.15vw, 20px) 'Barlow', sans-serif; letter-spacing: .28em; color: var(--ink); }
        .tag::before { content: ''; width: 5px; height: 1.1em; background: var(--cream); border-radius: 3px; }
        .no { font-weight: 900; color: var(--cream); }
        .name {
            margin-top: 6px;
            font: 900 clamp(3.6rem, 7vw, 8rem)/.95 'Barlow', 'VitroPRIDE', sans-serif;
            letter-spacing: .02em; color: var(--ink); white-space: nowrap;
        }
        .chips { margin-top: clamp(14px, 2vh, 24px); display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }
        .chip { display: flex; align-items: center; gap: 14px; }
        .chip b {
            min-width: 128px; text-align: center; padding: 5px 16px;
            font: 700 clamp(13px, 1vw, 17px) 'Barlow', sans-serif; letter-spacing: .24em; color: var(--cream); background: var(--ink);
        }
        .chip span { font-size: clamp(15px, 1.2vw, 21px); letter-spacing: .14em; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.25); }

        /* 스토리: 문장마다 검은 띠 */
        .story { margin-top: clamp(26px, 5vh, 56px); display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
        .story p {
            padding: 6px 12px; background: rgba(32,32,32,.86); color: #fff;
            font-size: clamp(14px, 1.1vw, 20px); line-height: 1.55; letter-spacing: .02em; word-break: keep-all;
            max-width: 100%;
        }

        /* ===== 캐릭터 그림 ===== */
        .figure {
            position: absolute; z-index: 3;
            right: var(--fig-r, 16vw); bottom: var(--fig-b, -6vh); height: var(--fig-h, 100vh);
            pointer-events: none;
        }
        .figure img { height: 100%; width: auto; display: block; filter: drop-shadow(14px 12px 0 rgba(32,32,32,.35)) drop-shadow(-4px 0 0 #fff) drop-shadow(4px 0 0 #fff) drop-shadow(0 -4px 0 #fff); }
        .soon {
            position: absolute; right: 0; bottom: 16%;
            font: 700 11px 'Barlow', sans-serif; letter-spacing: .3em; color: #fff;
            background: #202020; padding: 8px 12px; box-shadow: 4px 4px 0 var(--red-deep);
        }
        .figure:not(.portrait) .soon { display: none; }
        .figure.portrait img { -webkit-mask-image: linear-gradient(#000 78%, transparent); mask-image: linear-gradient(#000 78%, transparent); filter: drop-shadow(14px 12px 0 rgba(32,32,32,.35)); }

        /* ===== 좌우 화살표 ===== */
        .arrow {
            position: absolute; z-index: 8; top: 50%; translate: 0 -50%;
            width: clamp(64px, 5.4vw, 96px); aspect-ratio: 1; border-radius: 50%; border: 0; cursor: pointer;
            background: #2a2a2c; box-shadow: 4px 6px 0 var(--red-deep), inset 0 0 0 3px rgba(255,255,255,.08);
            display: grid; place-items: center; transition: transform .2s cubic-bezier(.2,1.4,.3,1), background .2s;
        }
        .arrow::before { content: ''; width: 42%; aspect-ratio: 1.15; background: var(--cream); clip-path: polygon(0 50%, 100% 0, 100% 100%); }
        .arrow.next::before { clip-path: polygon(100% 50%, 0 0, 0 100%); }
        .arrow.prev { left: clamp(14px, 1.6vw, 30px); }
        .arrow.next { right: clamp(14px, 1.6vw, 30px); }
        .arrow:hover, .arrow:focus-visible { transform: scale(1.08); background: var(--blue); outline: none; }

        /* ===== 첫 화면 아래: 스크롤 안내 ===== */
        .scroll-hint {
            position: absolute; z-index: 8; left: 50%; bottom: clamp(14px, 2.6vh, 30px); translate: -50% 0;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            font: 700 12px 'Barlow', sans-serif; letter-spacing: .4em; color: #fff; padding-left: .4em;
            text-shadow: 0 1px 6px rgba(0,0,0,.3);
        }
        .scroll-hint::after {
            content: ''; width: 14px; height: 14px; border-right: 3px solid #fff; border-bottom: 3px solid #fff;
            rotate: 45deg; animation: hintBob 1.4s ease-in-out infinite;
        }
        @keyframes hintBob { 50% { translate: 0 6px; } }

        /* ===== 아래 섹션: 깨진 유리 파편 속 캐릭터들 ===== */
        .shards-sec {                                 /* 배경 없음: 위 화면의 빨간 판·무늬가 그대로 이어진다 */
            position: relative;
            padding: clamp(70px, 10vh, 120px) 4vw clamp(90px, 14vh, 160px);
        }
        .shards-head { text-align: center; margin-bottom: clamp(30px, 6vh, 70px); }
        .shards-head h2 { font: 900 clamp(2rem, 3.4vw, 3.8rem)/1 'Barlow', sans-serif; letter-spacing: .3em; padding-left: .3em; color: var(--ink); }
        .shards-head p {
            display: inline-block; margin-top: 10px; padding: 5px 30px; border-radius: 999px;
            font-size: clamp(13px, 1vw, 17px); letter-spacing: .3em; color: var(--cream); background: var(--red-deep);
        }

        /* ===== 깨진 유리 파편: 화면 가운데를 중심으로 방사형(부채꼴)으로 퍼진 조각들 =====
           조각마다 가운데 쪽은 좁고 바깥쪽은 넓은 쐐기 모양 → 유리가 나를 향해 깨져 날아오는 시점.
           모양·위치는 JS가 화면 크기에 맞춰 계산한다. */
        .shards { position: relative; margin: 0 auto; max-width: 1700px; height: clamp(560px, 88vh, 1000px); }
        .shard {
            position: absolute; border: 0; padding: 0; background: none;
            pointer-events: none;                      /* 실제로 눌리는 곳은 조각 모양(.glass)만 */
            filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(10px 12px 0 rgba(20,6,6,.4));
            transform: translate(var(--hx, 0px), var(--hy, 0px));
            transition: transform .9s cubic-bezier(.16,.9,.3,1), opacity .4s ease;
            transition-delay: var(--d, 0s);
        }
        .shard .glass {
            position: absolute; inset: 0; clip-path: var(--shape); overflow: hidden; cursor: pointer; pointer-events: auto;
            background: linear-gradient(160deg, #b9cff0, #7fa3dc 60%, #5877b8);
        }
        .shard img {
            position: absolute; left: var(--fx, 50%); top: var(--fy, 50%); width: var(--fs, 70%); aspect-ratio: 1; height: auto;
            translate: -50% -50%; object-fit: cover; filter: grayscale(1) contrast(1.05);
            transition: filter .25s ease;
        }
        .shard .glass::after {                        /* 유리 반사광 */
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(125deg, rgba(255,255,255,.5) 0 7%, transparent 7% 28%, rgba(255,255,255,.2) 28% 31%, transparent 31%);
            mix-blend-mode: screen;
        }
        .shard .label {
            position: absolute; left: var(--lx, 50%); top: var(--ly, 80%); translate: -50% -50%; z-index: 2; pointer-events: none;
            display: flex; align-items: baseline; gap: 6px; white-space: nowrap;
            font: 900 clamp(13px, 1vw, 18px) 'Barlow', sans-serif; letter-spacing: .14em; color: #fff;
        }
        .shard .label b { padding: 3px 7px; background: #202020; }
        .shard .label span { padding: 3px 9px; background: var(--red); }
        /* 마우스를 올리면: 바깥 방향으로 살짝만 밀려나고 조금 밝아짐 (과하지 않게) */
        .shard:has(.glass:hover) { --hx: var(--px, 0px); --hy: var(--py, 0px); transition-delay: 0s; transition-duration: .3s; }
        .shard .glass:hover img { filter: grayscale(1) contrast(1.05) brightness(1.08); }
        .shard:focus-visible { outline: none; --hx: var(--px, 0px); --hy: var(--py, 0px); }
        .shard.current .glass { background: linear-gradient(160deg, #f4f2e9, #d9d4c4); }
        .shard.current .label span { background: var(--blue); }
        /* 장식: 사이트의 파랑으로 된 작은 유리 조각과 흰 부스러기 */
        .deco {
            position: absolute; left: var(--x); top: var(--y); width: var(--w); aspect-ratio: 1;
            clip-path: var(--shape); background: var(--c); pointer-events: none;
            translate: -50% -50%; rotate: var(--rz);
            transform: translate(var(--hx, 0px), var(--hy, 0px));
            transition: transform .9s cubic-bezier(.16,.9,.3,1), opacity .4s ease; transition-delay: var(--d, 0s);
        }
        .deco::after { content: ''; position: absolute; inset: 0; background: linear-gradient(130deg, rgba(255,255,255,.28) 0 12%, transparent 12% 60%, rgba(0,0,0,.2)); }
        .chip-w { --c: #fff; }
        /* 깨지기 전: 모두 가운데 쪽으로 모여 작게 → 스크롤해 들어오면 바깥으로 와장창 퍼짐 */
        .shards:not(.burst) .shard, .shards:not(.burst) .deco {
            opacity: 0; transform: translate(var(--cx0, 0px), var(--cy0, 0px)) scale(.35);
            transition-duration: 0s; transition-delay: 0s;
        }

        /* ===== 등장 / 바뀔 때 ===== */
        .play .info > * { animation: rise .7s cubic-bezier(.2,.75,.2,1) both; }
        .play .info > :nth-child(2) { animation-delay: .06s; }
        .play .info > :nth-child(3) { animation-delay: .12s; }
        .play .info > :nth-child(4) { animation-delay: .18s; }
        .play .info > :nth-child(5) { animation-delay: .24s; }
        .play .story p { animation: barIn .6s cubic-bezier(.2,.75,.2,1) both; }
        .play .story p:nth-child(2) { animation-delay: .38s; }
        .play .story p:nth-child(3) { animation-delay: .46s; }
        .play .story p:nth-child(4) { animation-delay: .54s; }
        .play .story p:nth-child(1) { animation-delay: .3s; }
        .play .watermark { animation: rise .8s cubic-bezier(.2,.75,.2,1) both; }
        .leaving .watermark { transition: opacity .22s ease; opacity: 0; }
        .play .figure { animation: figIn .9s cubic-bezier(.2,.8,.2,1) .1s both; }
        @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
        @keyframes barIn { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
        @keyframes figIn { from { opacity: 0; transform: translateX(70px); } }
        @keyframes bustIn { from { opacity: 0; transform: translateX(60px) scale(1.04); } }
        .leaving .info, .leaving .figure { transition: opacity .22s ease, transform .22s ease; opacity: 0; }
        .leaving .info { transform: translateY(-12px); }
        .leaving .figure { transform: translateX(50px); }

        /* ===== 좁은 화면 ===== */
        @media (max-width: 900px) {
            body { overflow: auto; }
            .stage { height: auto; min-height: 100vh; padding-bottom: 100px; }
            .heading { position: relative; left: 0; transform: none; top: 0; padding-top: 80px; }
            .info { position: relative; left: 0; top: 0; width: auto; margin: 30px 24px 0; }
            .watermark { display: none; }
            .figure { position: relative; right: auto; bottom: auto; height: 80vh; margin: 20px auto 0; display: flex; justify-content: center; }
            .bust, .arrow, .scroll-hint { display: none; }
            .shards { height: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 14px; }
            .shard, .shards:not(.burst) .shard { position: relative; left: auto !important; top: auto !important; width: auto !important; height: auto !important; aspect-ratio: 1; transform: none; opacity: 1; --shape: polygon(0 10%, 100% 0, 90% 100%, 6% 90%) !important; }
            .deco { display: none; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
    <!-- 캐릭터 자세히 보기 (한 페이지). character.html#02 처럼 번호를 붙여 열면 그 캐릭터로 시작한다.
         좌우 화살표나, 아래로 스크롤해서 나오는 유리 파편을 누르면 페이지 이동 없이 캐릭터만 바뀐다.
         캐릭터 정보는 맨 아래 CHARACTERS 목록에서 고친다. -->
    <!-- 페이지 전체 배경 (위·아래 섹션이 하나로 이어진다): 구름 영상 → 실루엣 → 뚫린 빨간 판 -->
        <div class="sky" aria-hidden="true"><video src="assets/videos/bg_sky.webm" autoplay muted loop playsinline></video></div>

        <!-- 빨간 판: 검은색으로 칠한 모양이 '구멍'이 되어 뒤의 구름이 보인다 -->
        <svg class="cutout" id="cutout" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <defs>
                <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
                    <rect width="7" height="18" fill="#000"/>
                </pattern>
                <pattern id="hatchFine" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
                    <rect width="3" height="11" fill="#000"/>
                </pattern>
                <mask id="holes" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
                    <rect id="maskBase" width="1600" height="900" fill="#fff"/>

                    <!-- 크게 휘어 오른쪽 위로 올라가는 곡선 띠 -->
                    <path fill="#000" d="M-60 640 C 260 520 560 700 860 560 S 1300 180 1680 210 L 1680 300 C 1330 280 1120 560 880 660 S 300 640 -60 760 Z"/>
                    <!-- 그 띠를 따라가는 가는 곡선 두 줄 -->
                    <path fill="none" stroke="#000" stroke-width="7" d="M-60 805 C 300 690 600 760 900 690 S 1330 330 1680 345"/>
                    <path fill="none" stroke="#000" stroke-width="4" d="M-60 835 C 300 730 620 795 920 725 S 1350 380 1680 392"/>

                    <!-- 사선 줄무늬 구역들 -->
                    <path fill="url(#hatch)" d="M0 120 L 300 0 L 520 0 L 0 300 Z"/>
                    <path fill="url(#hatchFine)" d="M1080 0 L 1600 0 L 1600 120 L 980 120 Z"/>
                    <path fill="url(#hatch)" d="M640 900 L 1020 760 L 1120 760 L 800 900 Z"/>
                    <!-- 굵은 사선 띠 -->
                    <path fill="#000" d="M380 0 L 430 0 L 160 260 L 110 260 Z"/>
                    <path fill="#000" d="M1500 900 L 1600 820 L 1600 860 L 1550 900 Z"/>

                    <!-- 시계: 테두리 고리 + 눈금 + 바늘 -->
                    <g transform="translate(250 712)">
                        <circle r="128" fill="none" stroke="#000" stroke-width="16"/>
                        <circle r="100" fill="none" stroke="#000" stroke-width="3"/>
                        <g stroke="#000" stroke-width="7" stroke-linecap="round">
                            <line y1="-92" y2="-72"/><line y1="92" y2="72"/><line x1="-92" x2="-72"/><line x1="92" x2="72"/>
                        </g>
                        <g stroke="#000" stroke-width="3">
                            <line y1="-92" y2="-80" transform="rotate(30)"/><line y1="-92" y2="-80" transform="rotate(60)"/>
                            <line y1="-92" y2="-80" transform="rotate(120)"/><line y1="-92" y2="-80" transform="rotate(150)"/>
                            <line y1="-92" y2="-80" transform="rotate(210)"/><line y1="-92" y2="-80" transform="rotate(240)"/>
                            <line y1="-92" y2="-80" transform="rotate(300)"/><line y1="-92" y2="-80" transform="rotate(330)"/>
                        </g>
                        <line y2="-58" stroke="#000" stroke-width="10" stroke-linecap="round" transform="rotate(-50)"/>
                        <line y2="-80" stroke="#000" stroke-width="6" stroke-linecap="round" transform="rotate(70)"/>
                        <circle r="10" fill="#000"/>
                    </g>
                    <line class="tick-hand" x1="250" y1="712" x2="250" y2="624" stroke="#000" stroke-width="2.5"/>

                    <!-- 카세트테이프: 테두리 + 라벨 창 + 릴 두 개 -->
                    <g transform="translate(1330 92) rotate(-10)">
                        <rect x="-150" y="-90" width="300" height="180" rx="16" fill="none" stroke="#000" stroke-width="12"/>
                        <rect x="-112" y="-60" width="224" height="92" rx="10" fill="none" stroke="#000" stroke-width="5"/>

    <script>
        /* 빨간 판을 페이지 전체 길이로 늘리고, 아래 섹션에도 곡선·사선·시계·카세트 구멍을 이어서 그린다.
           한 장의 SVG 라서 위 화면의 무늬가 끊기지 않고 아래로 이어진다. */
        (() => {
            const svg = document.getElementById('cutout'), more = document.getElementById('moreHoles');
            const base = document.getElementById('maskBase'), plate = document.getElementById('redPlate'), mask = document.getElementById('holes');
            const NS = 'http://www.w3.org/2000/svg';
            const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); more.appendChild(e); return e; };
            const clock = (x, y, r) => {
                el('circle', {cx: x, cy: y, r, fill: 'none', stroke: '#000', 'stroke-width': r * .125});
                el('circle', {cx: x, cy: y, r: r * .78, fill: 'none', stroke: '#000', 'stroke-width': 3});
                for (let k = 0; k < 12; k++) {
                    const a = k * Math.PI / 6, big = k % 3 === 0, r1 = r * .72, r2 = r * (big ? .56 : .63);
                    el('line', {x1: x + Math.sin(a) * r1, y1: y - Math.cos(a) * r1, x2: x + Math.sin(a) * r2, y2: y - Math.cos(a) * r2, stroke: '#000', 'stroke-width': big ? 7 : 3, 'stroke-linecap': 'round'});
                }
                const hand = (deg, len, w) => { const a = deg * Math.PI / 180; el('line', {x1: x, y1: y, x2: x + Math.sin(a) * len, y2: y - Math.cos(a) * len, stroke: '#000', 'stroke-width': w, 'stroke-linecap': 'round'}); };
                hand(130, r * .45, 10); hand(250, r * .62, 6);
                el('circle', {cx: x, cy: y, r: r * .08, fill: '#000'});
            };
            const cassette = (x, y, rot, s) => {
                const g = el('g', {transform: `translate(${x} ${y}) rotate(${rot}) scale(${s})`});
                g.innerHTML = '<rect x="-150" y="-90" width="300" height="180" rx="16" fill="none" stroke="#000" stroke-width="12"/>' +
                    '<rect x="-112" y="-60" width="224" height="92" rx="10" fill="none" stroke="#000" stroke-width="5"/>' +
                    '<circle cx="-56" cy="-14" r="24" fill="none" stroke="#000" stroke-width="9"/><circle cx="56" cy="-14" r="24" fill="none" stroke="#000" stroke-width="9"/>' +
                    '<rect x="-26" y="-24" width="52" height="20" fill="#000"/><path d="M-80 90 L -62 52 L 62 52 L 80 90" fill="none" stroke="#000" stroke-width="8"/>';
            };
            const draw = () => {
                const W = 1600, docH = document.documentElement.scrollHeight;
                const H = Math.max(900, W * docH / innerWidth);           // 화면 비율 그대로 → 원·시계가 찌그러지지 않음
                svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
                svg.setAttribute('preserveAspectRatio', 'none');
                svg.style.height = docH + 'px';
                [base, plate, mask].forEach(e => e.setAttribute('height', H));
                more.innerHTML = '';
                const S = W * innerHeight / innerWidth;                  // 첫 화면의 높이(SVG 단위)
                const L = H - S;                                         // 아래 섹션 길이
                const y = t => S + L * t;                                // 아래 섹션 안 세로 위치(0~1)

                // ① 첫 화면 아래쪽 사선 줄무늬 띠를 그대로 연장해 왼쪽 아래로 이어지게
                el('path', {fill: 'url(#hatch)', d: `M640 900 L1020 760 L1120 760 L${1120 - 320 * 4} ${760 + 140 * 4} L${1020 - 380 * 4} ${760 + 140 * 4} Z`});
                // ①-2 첫 화면 오른쪽 아래의 굵은 사선 띠도 끊기지 않게 연장
                el('path', {fill: '#000', d: 'M1500 900 L1550 900 L1250 1140 L1200 1140 Z'});
                // ② 오른쪽에서 크게 휘어 내려와 왼쪽 아래로 빠지는 곡선 띠 + 따라가는 가는 곡선 두 줄
                el('path', {fill: '#000', d: `M1680 ${y(.06)} C 1300 ${y(.1)} 1150 ${y(.42)} 820 ${y(.5)} S 200 ${y(.62)} -60 ${y(.82)} L -60 ${y(.9)} C 260 ${y(.72)} 560 ${y(.64)} 880 ${y(.58)} S 1340 ${y(.2)} 1680 ${y(.15)} Z`});
                el('path', {fill: 'none', stroke: '#000', 'stroke-width': 7, d: `M1680 ${y(.21)} C 1360 ${y(.26)} 1200 ${y(.6)} 900 ${y(.66)} S 260 ${y(.78)} -60 ${y(.98)}`});
                el('path', {fill: 'none', stroke: '#000', 'stroke-width': 4, d: `M1680 ${y(.25)} C 1380 ${y(.3)} 1220 ${y(.64)} 920 ${y(.7)} S 280 ${y(.82)} -60 ${y(1.02)}`});
                // ③ 오른쪽 아래 사선 줄무늬 묶음 + 굵은 사선 띠
                el('path', {fill: 'url(#hatchFine)', d: `M${W} ${y(.72)} L${W} ${H} L1180 ${H} Z`});
                el('path', {fill: '#000', d: `M1460 ${y(.4)} L1520 ${y(.4)} L1260 ${y(.62)} L1200 ${y(.62)} Z`});
                // ④ 시계와 카세트를 하나씩 더
                clock(1400, y(.84), 110);
                cassette(220, y(.3), 12, .8);
                // ⑤ 작은 삼각 파편
                el('path', {fill: '#000', d: `M700 ${y(.12)} l 30 -8 -12 28 z M120 ${y(.6)} l 26 4 -16 20 z M1060 ${y(.92)} l 24 10 -22 14 z M1540 ${y(.34)} l -26 8 14 -24 z`});
            };
            addEventListener('resize', draw);
            addEventListener('load', draw);
            if ('ResizeObserver' in window) new ResizeObserver(draw).observe(document.body);
            draw();
        })();
    </script>

    <script>
        /* ===== 캐릭터 정보 =====
           name: 큰 이름 / tag: 이름 위 작은 영어 / role: 역할 / relic: 대표 물건 / story: 문장마다 한 줄씩
           art: 전신 그림(없으면 thumb 를 대신 보여 줌) / fig: [높이, 아래 위치, 오른쪽 위치] */
        const CHARACTERS = [
            { no: '01', name: 'HEROINE', tag: 'PROTAGONIST', role: '주인공', relic: '낡은 음악 플레이어',
              thumb: 'assets/images/character01.png', art: 'assets/images/heroine_web.png', face: [.57, .085, .1], fig: ['90vh', '3vh', '16vw'],
              story: ['우연히 낡은 물건을 발견한 뒤 시간이 왜곡된 세계에 발을 들인다.', '기억 속에 남겨진 사람들의 과거를 따라가며,', '크로노와 함께 시간이 감춰온 진실을 마주한다.'] },
            { no: '02', name: 'NAME', tag: 'CHRONO', role: '크로노 멤버', relic: '낡은 스탠드 마이크',
              thumb: 'assets/images/character02.png', art: 'assets/images/heroine2_web.png', face: [.39, .1, .1], fig: ['92vh', '2vh', '18vw'],
              story: ['크로노의 두 번째 멤버.', '아직 밝혀지지 않은 과거와 자신만의 기억을 품고 있다.'] },
            { no: '03', name: 'NAME', tag: 'CHRONO', role: '크로노 멤버', relic: '낡은 회중시계',
              thumb: 'assets/images/character03.png', art: 'assets/images/cat_web.png', face: [.51, .27, .3], fig: ['80vh', '4vh', '15vw'],
              story: ['시간의 왜곡을 바라보는 또 다른 시선을 가진 인물.', '기억 속 사건과 깊은 연관이 있다.'] },
            { no: '04', name: 'NAME', tag: 'CHRONO', role: '크로노 멤버', relic: '미정',
              thumb: 'assets/images/character04.png', art: 'assets/images/man1_web.png', face: [.54, .084, .08], fig: ['90vh', '3vh', '22vw'],
              story: ['크로노와 함께 움직이며', '각자의 방식으로 기억 속에 남겨진 문제를 해결해 나간다.'] },
            { no: '05', name: 'NAME', tag: 'CHRONO', role: '크로노 멤버', relic: '미정',
              thumb: 'assets/images/character05.png', art: 'assets/images/heroine3_web.png', face: [.47, .093, .1], fig: ['90vh', '3vh', '20vw'],
              story: ['평범한 일상과 뒤틀린 시간 사이에서', '자신만의 답을 찾아가는 인물.'] },
            { no: '06', name: 'NAME', tag: 'CHRONO', role: '크로노 멤버', relic: '미정',
              thumb: 'assets/images/character06.png', art: '', face: [.45, .56, .45],
              story: ['시간에 얽힌 사건을 추적하며', '크로노의 비밀에 가까워지는 인물.'] },
            { no: '07', name: 'NAME', tag: 'CHRONO', role: '크로노 멤버', relic: '미정',
              thumb: 'assets/images/character07.png', art: '', face: [.37, .52, .45],
              story: ['서로 다른 기억들이 하나의 사건으로 이어지는 과정에서', '중요한 열쇠가 된다.'] },
        ];

        (() => {
            const $ = id => document.getElementById(id);
            const stage = $('stage'), figure = $('figure');
            // ===== 방사형 유리 파편 =====
            const box = $('shards');
            const thumbs = CHARACTERS.map((c, i) => {
                const b = document.createElement('button');
                b.type = 'button'; b.className = 'shard';
                b.setAttribute('aria-label', c.no + ' ' + c.name + ' 보기');
                b.innerHTML = `<span class="glass"><img src="${c.thumb}" alt="" loading="lazy"></span><span class="label"><b>${c.no}</b><span>${c.name}</span></span>`;
                b.querySelector('.glass').addEventListener('click', () => { history.replaceState(null, '', '#' + c.no); go(i); scrollTo({top: 0, behavior: 'smooth'}); });
                b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.querySelector('.glass').click(); } });
                box.appendChild(b);
                return b;
            });
            const decos = [];
            const layout = () => {
                if (innerWidth <= 900) return;                         // 좁은 화면은 CSS 격자
                decos.forEach(d => d.remove()); decos.length = 0;
                const W = box.clientWidth, H = box.clientHeight, cx = W / 2, cy = H / 2;
                const Ry = H * .5, Rx = Math.min(W * .5, Ry * 1.7);      // 가로로 조금 넓은 타원
                const r1 = .2, r2 = 1;                                  // 안쪽(좁은 끝)·바깥쪽 반지름 비율
                const a1 = 8, a2 = 21;                                  // 안쪽·바깥쪽 반각(도): 안쪽이 좁고 바깥이 넓은 쐐기
                const P = (deg, r) => { const t = deg * Math.PI / 180; return [cx + Math.cos(t) * Rx * r, cy + Math.sin(t) * Ry * r]; };
                const n = CHARACTERS.length, start = -90 - 360 / n / 2 + 360 / n / 2;
                thumbs.forEach((b, k) => {
                    const th = start + k * 360 / n + (k % 2 ? 3 : -3);   // 살짝 엇갈리게
                    const j1 = (k % 3) * .03, j2 = ((k + 1) % 3) * .04;  // 조각마다 길이 조금씩 다르게
                    // 안쪽 두 점(좁음) → 바깥쪽 두 점(넓음) + 바깥 모서리에 깨진 듯한 꺾임 하나
                    const pts = [
                        P(th - a1, r1 + j1), P(th + a1, r1 + j1 + .04),
                        P(th + a2, r2 - j2), P(th + a2 * .2, r2 - j2 + .04), P(th - a2, r2 - j2 - .06)
                    ];
                    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
                    const x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs) - x0, h = Math.max(...ys) - y0;
                    b.style.left = x0 + 'px'; b.style.top = y0 + 'px'; b.style.width = w + 'px'; b.style.height = h + 'px';
                    b.style.setProperty('--shape', 'polygon(' + pts.map(([x, y]) => `${((x - x0) / w * 100).toFixed(2)}% ${((y - y0) / h * 100).toFixed(2)}%`).join(',') + ')');
                    // 얼굴·이름표는 쐐기의 넓은 쪽 가운데쯤
                    const [fx, fy] = P(th, .64), [lx, ly] = P(th, .9);
                    b.style.setProperty('--fx', ((fx - x0) / w * 100) + '%'); b.style.setProperty('--fy', ((fy - y0) / h * 100) + '%');
                    b.style.setProperty('--fs', Math.min(w, h) * 1.15 + 'px');
                    b.style.setProperty('--lx', ((lx - x0) / w * 100) + '%'); b.style.setProperty('--ly', ((ly - y0) / h * 100) + '%');
                    // 마우스를 올리면 바깥 방향으로 10px, 등장할 때는 가운데에서 출발
                    const t = th * Math.PI / 180;
                    b.style.setProperty('--px', Math.cos(t) * 10 + 'px'); b.style.setProperty('--py', Math.sin(t) * 10 + 'px');
                    b.style.setProperty('--cx0', (cx - (x0 + w / 2)) * .8 + 'px'); b.style.setProperty('--cy0', (cy - (y0 + h / 2)) * .8 + 'px');
                    b.style.setProperty('--d', (k * .05) + 's');
                });
                // 조각 사이 틈과 가운데에 파란 작은 조각, 흰 부스러기
                const BLUES = ['#5877b8', '#3f5a96', '#8fa8d8', '#2e4373'];
                for (let k = 0; k < CHARACTERS.length; k++) {
                    const th = start + (k + .5) * 360 / CHARACTERS.length, t = th * Math.PI / 180;
                    const add = (r, size, c, shape, d) => {
                        const e = document.createElement('i'); e.className = 'deco';
                        const x = cx + Math.cos(t) * Rx * r, y = cy + Math.sin(t) * Ry * r;
                        e.style.cssText = `--x:${x}px;--y:${y}px;--w:${size}px;--c:${c};--rz:${th + 90}deg;--d:${d}s;--shape:${shape};--cx0:${(cx - x) * .8}px;--cy0:${(cy - y) * .8}px`;
                        box.prepend(e); decos.push(e);
                    };
                    add(.42 + (k % 2) * .25, 46 + (k % 3) * 16, BLUES[k % 4], 'polygon(50% 0, 100% 100%, 0 100%)', .1 + k * .04);
                    add(.9 + (k % 2) * .05, 12 + (k % 3) * 5, '#fff', 'polygon(0 0,100% 30%,40% 100%)', .25 + k * .03);
                }
            };
            layout();
            addEventListener('resize', layout);
            if ('ResizeObserver' in window) new ResizeObserver(layout).observe(box);
            // 목록이 화면에 들어오면 와장창 퍼지고, 위로 올라가면 다시 모였다가 다음에 또 재생
            if ('IntersectionObserver' in window) {
                new IntersectionObserver(es => es.forEach(en => {
                    if (en.isIntersecting && en.intersectionRatio > .25) box.classList.add('burst');
                    else if (!en.isIntersecting) box.classList.remove('burst');
                }), {threshold: [0, .25]}).observe(box);
            } else box.classList.add('burst');
            CHARACTERS.forEach(c => { const im = new Image(); im.src = c.art || c.thumb; });   // 미리 불러오기

            let cur = -1, busy = 0;
            const fill = i => {
                const c = CHARACTERS[i];
                $('no').textContent = c.no;
                $('tag').textContent = c.tag;
                $('name').textContent = c.name;
                $('wm').textContent = c.name;
                $('role').textContent = c.role;
                $('relic').textContent = c.relic;
                $('story').innerHTML = '';
                c.story.forEach(t => { const p = document.createElement('p'); p.textContent = t; $('story').appendChild(p); });
                const src = c.art || c.thumb;
                $('figImg').src = src;
                $('figImg').alt = c.no + '번 캐릭터 ' + (c.art ? '전신 일러스트' : '얼굴 그림');
                // 얼굴 확대: 눈(face[0], face[1])이 화면의 EYE 지점에 오고, 머리 높이가 HEAD 만큼 되도록
                const bi = $('bustImg'), face = c.face || [.5, .5, .45];
                const placeBust = () => {
                    // 눈이 오른쪽 위 곡선 띠 구멍의 한가운데(배경 SVG 좌표 1312, 337)에 오게 → 어떤 화면에서도 눈이 보인다
                    const k = innerWidth / 1600, EYE_X = 1312 * k, EYE_Y = 337 * k, HEAD = 250 * k;   // HEAD = 머리 높이(px)
                    const h = HEAD / face[2], w = h * (bi.naturalWidth / bi.naturalHeight || .55);
                    bi.style.height = h + 'px';
                    bi.style.left = (EYE_X - w * face[0]) + 'px';
                    bi.style.top = (EYE_Y - h * face[1]) + 'px';
                };
                bi.onload = placeBust; bi.src = src;
                if (bi.complete) placeBust();
                window.__placeBust = placeBust;
                figure.classList.toggle('portrait', !c.art);
                const [h, b, r] = c.art ? c.fig : ['74vh', '10vh', '16vw'];
                figure.style.setProperty('--fig-h', h);
                figure.style.setProperty('--fig-b', b);
                figure.style.setProperty('--fig-r', r);
                $('back').href = 'index.html#char-' + c.no;
                document.title = (c.name === 'NAME' ? 'CHARACTER ' + c.no : c.name) + ' | Chronostasis';
                thumbs.forEach((t, k) => {
                    t.classList.toggle('current', k === i);
                    if (k === i) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
                });
                if (location.hash !== '#all') history.replaceState(null, '', '#' + c.no);
                cur = i;
            };
            const replay = () => { stage.classList.remove('play'); void stage.offsetWidth; stage.classList.add('play'); };
            const go = i => {
                i = (i + CHARACTERS.length) % CHARACTERS.length;
                if (i === cur) return;
                clearTimeout(busy);
                stage.classList.add('leaving');
                busy = setTimeout(() => { fill(i); stage.classList.remove('leaving'); replay(); }, 240);
            };
            $('prev').addEventListener('click', () => go(cur - 1));
            $('next').addEventListener('click', () => go(cur + 1));
            addEventListener('resize', () => window.__placeBust && window.__placeBust());
            addEventListener('keydown', e => {
                if (e.key === 'ArrowLeft') go(cur - 1);
                if (e.key === 'ArrowRight') go(cur + 1);
            });
            const fromHash = () => { const n = parseInt(location.hash.slice(1), 10); return n >= 1 && n <= CHARACTERS.length ? n - 1 : (cur < 0 ? 0 : cur); };
            fill(fromHash());
            addEventListener('hashchange', () => go(fromHash()));
        })();
    </script>
</body>
</html>
